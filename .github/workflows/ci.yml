name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The NDK app/build.gradle.kts pins; installed up front so AGP doesn't download it mid-build.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null

      - name: Test
        run: ./gradlew :owl:test :app:testDebugUnitTest :owl:owlJar

      # bsdtar reads .deb (ar) archives, which scripts/fetch-proot.sh needs; not on the runner by default.
      - name: Install bsdtar
        run: sudo apt-get update -y && sudo apt-get install -y libarchive-tools

      # Builds proot itself (from Termux's source) so this build's Linux features actually work,
      # not just a placeholder that lets wlbridge/lint run.
      - name: Build proot
        run: ./scripts/fetch-proot.sh

      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug

      # Downloadable from the run's summary page; a full build with proot, so Linux features work.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
